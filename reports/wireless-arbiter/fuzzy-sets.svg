<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="IBM Plex Mono, Consolas, Menlo, monospace">
  <rect width="640" height="360" fill="#000"/>

  <!-- grid -->
  <g stroke="#1a1a1a" stroke-width="1">
    <line x1="60" y1="60" x2="600" y2="60"/>
    <line x1="60" y1="170" x2="600" y2="170"/>
    <line x1="168" y1="50" x2="168" y2="280"/>
    <line x1="276" y1="50" x2="276" y2="280"/>
    <line x1="384" y1="50" x2="384" y2="280"/>
    <line x1="492" y1="50" x2="492" y2="280"/>
  </g>

  <!-- axes -->
  <g stroke="#8a8a8a" stroke-width="1">
    <line x1="60" y1="280" x2="600" y2="280"/>
    <line x1="60" y1="50" x2="60" y2="280"/>
  </g>
  <g fill="#8a8a8a" font-size="12" text-anchor="middle">
    <text x="60" y="300">0</text>
    <text x="168" y="300">2</text>
    <text x="276" y="300">4</text>
    <text x="384" y="300">6</text>
    <text x="492" y="300">8</text>
    <text x="600" y="300">10</text>
    <text x="330" y="330" font-size="12" letter-spacing="1.5">QUEUE OCCUPANCY</text>
  </g>
  <g fill="#8a8a8a" font-size="12" text-anchor="end">
    <text x="50" y="64">1</text>
    <text x="50" y="174">0.5</text>
    <text x="50" y="284">0</text>
  </g>

  <!-- membership functions -->
  <polyline points="60,60 195,60 330,280" fill="none" stroke="#fff" stroke-width="2.5"/>
  <polyline points="168,280 330,60 492,280" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="9 6"/>
  <polyline points="330,280 465,60 600,60" fill="none" stroke="#bdbdbd" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round"/>

  <!-- labels -->
  <g font-size="14" font-weight="600" text-anchor="middle" fill="#fff">
    <text x="128" y="44">LO</text>
    <text x="330" y="44">JR</text>
    <text x="532" y="44">HI</text>
  </g>
</svg>
